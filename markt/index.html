<!doctype html>
<!--
  Markt-Planer – Helfer-Einteilung Weihnachtsmarkt Schwäbisch Gmünd (bienenplan.de/markt/)
  Version 0.1.2 (2026-10-27, markt-dev)

  Changelog
  0.1.2  Version parameter 0.1.2 (traffic-light colours in style.css/app.js).
  0.1.1  Third dialog button (QA N1 "Stattdessen ganzen Block …"), version parameter 0.1.1 (QA H6).
  0.1.0  First version: header with own bee/fir SVG, deadline countdown, status, legend, day tiles,
         summary per helper, admin area (only with ?a=), error banners, confirm dialog. No CDN, no external fonts.
         Change 26.10.: footer "1 Helfer je Block" (blocks are rendered by app.js).
-->
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#1f4a33">
  <title>Standplan Weihnachtsmarkt</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 6 L46 26 H39 L50 40 H41 L53 54 H11 L23 40 H14 L25 26 H18 Z' fill='%232e6b47'/%3E%3Ccircle cx='32' cy='8' r='4' fill='%23e0a526'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css?v=0.2.0">
</head>
<body>
  <header class="kopf">
    <div class="kopf-innen">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
        <circle cx="32" cy="32" r="31" class="logo-grund"/>
        <path class="logo-flug" d="M9 30 C 14 18, 26 22, 24 30 S 36 40, 44 22" fill="none"/>
        <path class="logo-tanne" d="M32 13 L43 27 H37.5 L47 39 H40 L50 51 H14 L24 39 H17 L26.5 27 H21 Z"/>
        <rect class="logo-stamm" x="29" y="51" width="6" height="6" rx="1"/>
        <path class="logo-stern" d="M32 4.5 l1.9 3.9 4.3.6-3.1 3 .7 4.3L32 14.3l-3.8 2 .7-4.3-3.1-3 4.3-.6z"/>
        <circle class="logo-kugel-rot" cx="28" cy="33" r="2.1"/>
        <circle class="logo-kugel-gold" cx="37.5" cy="44" r="2.1"/>
        <circle class="logo-kugel-rot" cx="23.5" cy="47" r="1.8"/>
        <circle class="logo-kugel-gold" cx="35" cy="22.5" r="1.6"/>
        <g transform="translate(48 17) rotate(-18)">
          <ellipse class="logo-fluegel" cx="-2.6" cy="-4.6" rx="3.6" ry="2.6"/>
          <ellipse class="logo-fluegel" cx="1.8" cy="-4.9" rx="3.6" ry="2.6"/>
          <ellipse class="logo-biene" cx="0" cy="0" rx="5.6" ry="3.9"/>
          <path class="logo-streifen" d="M-1.6 -3.5v7M1.8 -3.3v6.6"/>
          <circle class="logo-kopfteil" cx="5.6" cy="-0.4" r="2.1"/>
        </g>
      </svg>
      <div class="titel">
        <p class="obertitel">Weihnachtsmarkt Schwäbisch Gmünd</p>
        <h1>Standplan</h1>
        <p class="zeitraum" id="zeitraum">26.11. – 21.12.2026</p>
      </div>
      <div class="kopf-status" id="kopf-status" aria-live="polite"></div>
    </div>
  </header>

  <div id="demo-leiste" class="demo-leiste" hidden></div>

  <main class="inhalt">
    <div id="banner" class="banner-bereich" aria-live="assertive"></div>
    <section id="ich" class="karte ich" aria-live="polite"></section>
    <section id="legende" class="legende" aria-label="Legende"></section>
    <section id="kalender" class="kalender" aria-label="Markttage" aria-busy="true">
      <div class="lade">Plan wird geladen …</div>
    </section>
    <section id="zusammenfassung" class="karte zusammenfassung" hidden></section>
    <section id="admin" class="admin" hidden></section>
  </main>

  <footer class="fuss">
    <p>Do–So 11–20 Uhr · 1 Helfer je Block · Julian ist immer da · Markt-Planer <span id="version"></span></p>
  </footer>

  <dialog id="dialog" class="dialog">
    <form method="dialog">
      <h2 id="dialog-titel"></h2>
      <p id="dialog-text"></p>
      <div class="dialog-knoepfe">
        <button value="nein" class="knopf zweitrangig">Abbrechen</button>
        <button value="extra" class="knopf honig" id="dialog-extra" hidden></button>
        <button value="ja" class="knopf" id="dialog-ja">Ja</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js?v=0.2.0"></script>
</body>
</html>
